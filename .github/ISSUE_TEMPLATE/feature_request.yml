name: Feature request
description: Suggest a workflow improvement.
title: "[Idea]: "
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: Describe your workflow and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested improvement
      description: A description, sketch or screenshot is welcome.
    validations:
      required: true
